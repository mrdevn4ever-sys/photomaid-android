name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Tests, Lint, Release-Build (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core + App-Tests, Lint, Release (R8), installierbare APKs
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -Pphotomaid.signWithDebug=true --continue
      - name: Installierbare APKs (Debug + Release mit Debug-Signatur, nur zum Testen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMaid-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: JVM-Screenshots
        run: ./gradlew :app:recordRoborazziDebug --tests '*ScreenshotTest*'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-reports
          path: |
            **/build/test-results/**
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
      - name: Berechtigungen im Release-APK
        run: $ANDROID_HOME/build-tools/36.0.0/aapt2 dump permissions app/build/outputs/apk/release/app-release.apk

  emulator:
    name: Emulator-Durchgang API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleQa
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: OUT=emulator-screens-${{ matrix.api }} bash scripts/ci_emulator_smoke.sh app/build/outputs/apk/qa/app-qa.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens-${{ matrix.api }}
          path: emulator-screens-${{ matrix.api }}/
